name: Deploy Challenges

on:
  push:
    branches: ["dev"]

jobs:
  get-challenges:
    name: Get All Challenges
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build challenge matrix
        id: set-matrix
        run: |
          echo "::group::Getting all challenges"
          matrix_json="["
          first=true
          workspace="${GITHUB_WORKSPACE}/challenges"
          shopt -s globstar

          for f in "$workspace"/**/info.yaml; do
            [ -e "$f" ] || continue
            dir=$(dirname "$f")
            rel="${dir#$GITHUB_WORKSPACE/}"          # e.g. "challenges/web/xss"
            name=$(basename "$dir")                  # e.g. "xss"
            category=$(basename "$(dirname "$dir")") # e.g. "web"

            if [ "$first" = true ]; then
              first=false
            else
              matrix_json+=","
            fi

            matrix_json+="{\"path\":\"$rel\",\"category\":\"$category\",\"name\":\"$name\"}"
          done

          matrix_json+="]"
          echo "matrix=$matrix_json" >> $GITHUB_OUTPUT
          echo "::endgroup::"

  assign-external-ports:
    name: Assign External Ports
    needs: discover-challenges
    runs-on: ubuntu-latest
    outputs:
      env: ${{ steps.vars.outputs.port }}
    strategy:
      matrix:
        include: ${{ fromJson(needs.discover-challenges.outputs.matrix) }}
    # #TODO: only run if any of the head_commit arrays contains "challenges/", make this into challenge specific, also test, also confirm this would execute on every commit to main
    if: |
      contains(join(github.event.head_commit.added, ''), 'challenges/') ||
      contains(join(github.event.head_commit.modified, ''), 'challenges/') ||
      contains(join(github.event.head_commit.removed, ''), 'challenges/')
    steps:
      - name: Find those envs
        uses: actions/checkout@v4
      - name: get next available ports variable
      - name: update next available ports variable
      - name: generate content for .env
        run: echo "port=asdf" >> $
