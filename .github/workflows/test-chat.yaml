name: Deploy Challenges (Python-driven)

on:
  workflow_dispatch:
  push:
    paths:
      - "challenges/**"
      - ".github/workflows/**"

jobs:
  # 1) Create matrix: list "challenges/<category>/<challenge>" directories
  GET-ALL-CHALLENGES:
    runs-on: ubuntu-latest
    outputs:
      challenges: ${{ steps.get.outputs.challenges }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.x" }

      - name: Build challenge matrix (Python)
        id: get
        run: |
          python - <<'PY'
          import os, json, sys
          base = "challenges"
          out = []
          # exactly two levels deep: challenges/<cat>/<name>
          if os.path.isdir(base):
            for cat in sorted(os.listdir(base)):
              pcat = os.path.join(base, cat)
              if not os.path.isdir(pcat): continue
              for name in sorted(os.listdir(pcat)):
                p = os.path.join(pcat, name)
                if os.path.isdir(p):
                  out.append(os.path.relpath(p, base))
          payload = json.dumps(out)
          print("Matrix:", payload)
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
            f.write(f"challenges={payload}\n")
          PY

  # 2) Single-shot deploy: copy once, run ONE remote script that iterates all challenges.
  #    Never fail on a single challenge; collect per-challenge logs + status and upload.
  DEPLOY-ALL-ONCE:
    runs-on: ubuntu-latest
    needs: GET-ALL-CHALLENGES
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      ZONE: us-east1-b
      VM_NAME: challenges
      VM_USER: cyber_f25_0000
      MATRIX: ${{ needs.GET-ALL-CHALLENGES.outputs.challenges }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.x" }

      - name: Authenticate GCP
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          version: ">= 363.0.0"
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Deploy all (Python drives gcloud; single remote execution)
        run: |
          python - <<'PY'
          import json, os, subprocess, shlex, tempfile, pathlib

          ZONE = os.environ["ZONE"]
          VM   = os.environ["VM_NAME"]
          USER = os.environ["VM_USER"]
          MATRIX = json.loads(os.environ["MATRIX"])

          # 1) Copy fresh challenges tree to VM
          def run(cmd):
            print("+", cmd)
            return subprocess.run(cmd, shell=True, check=False)

          # Remove remote /home/<user>/challenges then copy local ./challenges
          run(f"gcloud compute ssh {USER}@{VM} --zone={ZONE} "
              f"--command={shlex.quote('[ -d ~/challenges ] && rm -rf ~/challenges || true')}")

          run(f"gcloud compute scp --recurse --zone={ZONE} "
              f"challenges {USER}@{VM}:/home/{USER}/")

          # 2) Prepare the remote deploy script (Bash executed once)
          #    Python assembles content and pushes it; the script loops challenges and writes logs/status remotely.
          def sanitize(s: str) -> str:
            return s.replace("/", "__").replace(" ", "__")

          remote_script = r"""#!/usr/bin/env bash
          set -uo pipefail
          LOG_ROOT="$HOME/deploy-logs"
          mkdir -p "$LOG_ROOT"
          : > "$LOG_ROOT/summary.tsv"

          sanitize() { echo "$1" | sed 's#[/ ]#__#g'; }

          while IFS= read -r rel; do
            [ -z "$rel" ] && continue
            cdir="$HOME/challenges/$rel"
            name_safe="$(sanitize "$rel")"
            log="$LOG_ROOT/${name_safe}.log"
            status="$LOG_ROOT/${name_safe}.status"

            # pick compose file if present
            cf=""
            if [ -f "$cdir/compose.yaml" ]; then cf="$cdir/compose.yaml"; fi
            if [ -z "$cf" ] && [ -f "$cdir/docker-compose.yml" ]; then cf="$cdir/docker-compose.yml"; fi

            if [ -z "$cf" ]; then
              echo "SKIP: $rel (no compose file)" | tee -a "$log"
              echo "SKIP" > "$status"
              printf "%s\tSKIP\tno-compose\n" "$rel" >> "$LOG_ROOT/summary.tsv"
              continue
            fi

            {
              echo "==> $rel start $(date -Is)"
              echo "compose: $cf"
              (cd "$cdir" && sudo docker compose -f "$cf" up -d --build)
              rc=$?
              echo "exit=$rc"
              echo "<== $rel end $(date -Is)"
              exit $rc
            } &> "$log"

            rc=$?
            if [ $rc -eq 0 ]; then
              echo "OK" > "$status"
              printf "%s\tOK\tbuild-ok\n" "$rel" >> "$LOG_ROOT/summary.tsv"
            else
              echo "FAIL" > "$status"
              printf "%s\tFAIL\trc=%s\n" "$rel" "$rc" >> "$LOG_ROOT/summary.tsv"
            fi
          done < "$HOME/challenges.list"

          # Always exit 0 so the job can upload artifacts even if some failed
          exit 0
          """

          # 3) Write list + script locally
          work = pathlib.Path.cwd() / ".gha-tmp"
          work.mkdir(exist_ok=True)
          (work / "challenges.list").write_text("\n".join(MATRIX) + "\n", encoding="utf-8")
          (work / "deploy_all.sh").write_text(remote_script, encoding="utf-8")

          # 4) Copy list + script to VM
          run(f"gcloud compute scp --zone={ZONE} {shlex.quote(str(work/'challenges.list'))} "
              f"{USER}@{VM}:/home/{USER}/challenges.list")
          run(f"gcloud compute scp --zone={ZONE} {shlex.quote(str(work/'deploy_all.sh'))} "
              f"{USER}@{VM}:/home/{USER}/deploy_all.sh")

          # 5) Execute ONCE over SSH
          run(f"gcloud compute ssh {USER}@{VM} --zone={ZONE} --command="
              f"{shlex.quote('bash -lc \"chmod +x ~/deploy_all.sh && ~/deploy_all.sh\"')}")

          # 6) Pull back logs to ./build-results
          subprocess.run("rm -rf build-results && mkdir -p build-results", shell=True, check=False)
          run(f"gcloud compute scp --recurse --zone={ZONE} "
              f"{USER}@{VM}:/home/{USER}/deploy-logs build-results")
          PY

      - name: Upload all build logs
        uses: actions/upload-artifact@v4
        with:
          name: build-results
          path: build-results/**

  # 3) Per-challenge verification: fan-out; fail only if its own status == FAIL
  PER-CHALLENGE-VERIFY:
    needs: [GET-ALL-CHALLENGES, DEPLOY-ALL-ONCE]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        challenge: ${{ fromJson(needs.GET-ALL-CHALLENGES.outputs.challenges) }}
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: "3.x" }

      - name: Download logs
        uses: actions/download-artifact@v4
        with:
          name: build-results

      - name: Check status for this challenge (Python)
        run: |
          python - <<'PY'
          import os, sys, glob

          def sanitize(s: str) -> str:
            return s.replace("/", "__").replace(" ", "__")

          challenge = os.environ["CHALLENGE"]
          safe = sanitize(challenge)
          status_path = os.path.join("build-results", "deploy-logs", f"{safe}.status")
          log_path    = os.path.join("build-results", "deploy-logs", f"{safe}.log")

          if not os.path.exists(status_path):
            print(f"[{challenge}] No status file → SKIP (no compose?)")
            sys.exit(0)

          status = open(status_path, "r", encoding="utf-8").read().strip()
          print(f"[{challenge}] STATUS = {status}")
          if os.path.exists(log_path):
            print("---- LOG (head) ----")
            with open(log_path, "r", encoding="utf-8", errors="ignore") as f:
              for i, line in zip(range(200), f):
                print(line.rstrip())

          if status == "FAIL":
            sys.exit(1)
          else:
            sys.exit(0)
          PY
        env:
          CHALLENGE: ${{ matrix.challenge }}
