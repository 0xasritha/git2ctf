name: CHAT Deploy Challenges

on:
  push:
    branches: ["dev"]

jobs:
  define-challenges-matrix:
    runs-on: ubuntu-latest
    outputs:
      challenges: ${{ steps.get-challenges.outputs.challenges }}
    steps:
      - uses: actions/checkout@v4
      - name: Get Challenges
        id: get-challenges
        run: |
          # /challenges/<category>/<challenge>
          json=$(find challenges -mindepth 2 -maxdepth 2 -type d -printf '%P\n' \
            | jq -R . | jq -c -s .)
          echo "challenges=$json" >> "$GITHUB_OUTPUT"

  per-challenge:
    name: ${{ matrix.challenge }} # one node per challenge
    needs: define-challenges-matrix
    runs-on: ubuntu-latest
    strategy:
      matrix:
        challenge: ${{ fromJson(needs.define-challenges-matrix.outputs.challenges) }}
    steps:
      - uses: actions/checkout@v4

      - name: Derive paths
        id: paths
        shell: bash
        run: |
          # matrix.challenge is "category/challenge"
          IFS='/' read -r CATEGORY CHALL <<< "${{ matrix.challenge }}"
          echo "category=$CATEGORY" >> "$GITHUB_OUTPUT"
          echo "chall=$CHALL" >> "$GITHUB_OUTPUT"
          echo "root=challenges/${{ matrix.challenge }}" >> "$GITHUB_OUTPUT"

      - name: Push static assets (if present)
        if: ${{ hashFiles( format('{0}/static/**', steps.paths.outputs.root) ) != '' }}
        shell: bash
        run: |
          echo "::group::Push static assets"
          echo "Pushing assets for ${{ matrix.challenge }}"
          # TODO: your real upload logic here
          echo "::endgroup::"

      - name: Authenticate With GCP (for deploy)
        if: ${{ hashFiles( format('{0}/docker-compose*.yml', steps.paths.outputs.root) ) != '' }}
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Set up Cloud SDK (for deploy)
        if: ${{ hashFiles( format('{0}/docker-compose*.yml', steps.paths.outputs.root) ) != '' }}
        uses: google-github-actions/setup-gcloud@v3
        with:
          version: ">= 363.0.0"

      - name: Deploy challenge on VM (if compose present)
        if: ${{ hashFiles( format('{0}/docker-compose*.yml', steps.paths.outputs.root) ) != '' }}
        shell: bash
        run: |
          echo "::group::Deploy on VM"
          echo "Deploying ${{ matrix.challenge }}"
          # TODO: your real deploy logic here (gcloud ssh/scp, etc.)
          gcloud projects list
          echo "::endgroup::"

      - name: Create/Update CTFd entry
        shell: bash
        run: |
          echo "::group::CTFd entry"
          echo "Creating/updating CTFd for ${{ matrix.challenge }}"
          # TODO: your CTFd API call(s)
          echo "::endgroup::"
