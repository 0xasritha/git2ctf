name: Deploy Challenges

on:
  push:
    branches: ["dev"]

# manual trigger or event triggers a workflow: runs 1(+) jobs, which executes on a runner machine and runs series of 1(+) steps
#      - note that all the steps in a job execute on the same runner machine (so they will share the same filesystem)
#         - each step runs in its own shell, so exported variables only persist within a single step unless explicitly saved using the "set-output" or $GITHUB_ENV mechanism
# steps can run a script you define or run an action (reusable action)
# each step runs in its own process (so env variables are NOT preserved between steps)
# workflows defined in .github/workflows

jobs:
  GET-ALL-CHALLENGES:
    runs-on: ubuntu-latest
    outputs:
      challenges: ${{ steps.get-challenges.outputs.challenges }}
    steps:
      - uses: actions/checkout@v4
      # TODO: add comments for this
      - name: Get Challenges
        id: get-challenges
        run: |
          # Find all challenge dirs two levels deep: /challenges/<category>/<challenge>
          json=$(find challenges -mindepth 2 -maxdepth 2 -type d -printf '%P\n' \
            | jq -R . | jq -c -s .)
          echo "challenges=$json" >> "$GITHUB_OUTPUT"
  # TODO: add a job here that stops execution if no files where changed
  # TODO: should I make some executions only trigger for challenges with /static/ or have docker-compose
  per-challenge-deploy-to-ctfd:
    name: ${{ matrix.challenge }}
    needs: GET-ALL-CHALLENGES
    runs-on: ubuntu-latest
    env:
      CTFD_TOKEN: ${{ secrets.CTFD_TOKEN }}
      CTFD_DOMAIN: ${{ vars.CTFD_DOMAIN }}
      CHALLENGE_PATH: ${{ matrix.challenge }}
      EXISTING_CHALLENGES: ${{ vars.EXISTING_CHALLENGES }}
