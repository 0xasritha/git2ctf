name: Deploy Challenges

on:
  push:
    branches: ["dev"]

# ✅ Concurrency (workflow-level) to prevent two runs colliding with each other
concurrency:
  group: deploy-${{ vars.GCP_PROJECT_ID }}-${{ vars.VM_NAME }}
  cancel-in-progress: false

jobs:
  GET-ALL-CHALLENGES:
    runs-on: ubuntu-latest
    outputs:
      challenges: ${{ steps.get-challenges.outputs.challenges }}
    steps:
      - uses: actions/checkout@v4
      # TODO: add comments for this
      - name: Get Challenges
        id: get-challenges
        run: |
          # Find all challenge dirs two levels deep: /challenges/<category>/<challenge>
          json=$(find challenges -mindepth 2 -maxdepth 2 -type d -printf '%P\n' \
            | jq -R . | jq -c -s .)
          echo "challenges=$json" >> "$GITHUB_OUTPUT"

  # TODO: add a job here that stops execution if no files where changed
  # TODO: these respectively should only trigger for challenges with `/static/` or have docker-compose
  per-challenge:
    name: ${{ matrix.challenge }}
    needs: GET-ALL-CHALLENGES
    runs-on: ubuntu-latest
    strategy:
      matrix:
        challenge: ${{ fromJson(needs.GET-ALL-CHALLENGES.outputs.challenges) }}
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate With GCP (for deploy)
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
      - name: "Set up Cloud SDK"
        uses: "google-github-actions/setup-gcloud@v3"
        with:
          version: ">= 363.0.0"
          project_id: ${{ vars.GCP_PROJECT_ID }}
      - name: Upload Static Files (If Present)
        if: ${{ hashFiles(format('challenges/{0}/static/**', matrix.challenge)) != '' }}
        uses: google-github-actions/upload-cloud-storage@v2
        with:
          path: "challenges/${{ matrix.challenge }}/static"
          parent: false
          headers: |-
            content-disposition: 'attachment'
          destination: "${{ vars.STATIC_ASSETS_BUCKET_NAME }}/${{ matrix.challenge }}"
      - name: "Use gcloud CLI"
        run: "gcloud compute instances list"

      # ✅ Step-level mutex so only ONE parallel job touches the VM via SSH/SCP at a time
      - name: Queue for VM SSH access
        uses: softprops/turnstyle@v1
        with:
          poll-interval-seconds: 10
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # lock scope is the VM; parallel jobs to other VMs aren't blocked
          TURNSTYLE_GROUP: vm-ssh-${{ vars.GCP_PROJECT_ID }}-${{ vars.VM_NAME }}

      - name: Create CTFd Challenge Entry or Update CTFd Challenge Entry Connection Info
        if: ${{ hashFiles(format('challenges/{0}/docker-compose*.yml', matrix.challenge)) != '' || hashFiles(format('challenges/{0}/docker-compose*.yaml', matrix.challenge)) != '' || hashFiles(format('challenges/{0}/compose*.yml', matrix.challenge)) != '' || hashFiles(format('challenges/{0}/compose*.yaml', matrix.challenge)) != '' }}
        # TODO: test how the logs show up here, ie. if there is a port collision and it cannot deploy on the remote VM
        run: |
          # Clean up old docker compose
          gcloud compute ssh ${{ vars.VM_USER }}@${{ vars.VM_NAME }} --zone=${{ vars.VM_ZONE }} --command="DIR=/home/${{ vars.VM_USER }}/challenges/${{ matrix.challenge }} --troubleshoot; if [ -d \$DIR ]; then cd \$DIR && sudo docker compose down; cd .. && rm -rf \$DIR; fi || true"

          gcloud compute scp --zone=${{ vars.VM_ZONE }} --recurse challenges/${{ env.branch }} ${{ vars.VM_USER }}@${{ vars.VM_NAME }}:/home/${{ vars.VM_USER }}/challenges/${{ matrix.challenge }}

          gcloud compute ssh ${{ vars.VM_USER }}@${{ vars.VM_NAME }} --zone=${{ vars.VM_ZONE }} --command="cd /home/${{ vars.USER }}/challenges/${{ matrix.challenge }} --troubleshoot && sudo docker compose up --build -d"
